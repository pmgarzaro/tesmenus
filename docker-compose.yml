services:
  tesmenus:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Définir APP_PASSWORD dans .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Passer à true derrière un reverse proxy HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data
